name: scan-olx

# OLX GitHub serverlarini bloklaydi (HTTP 403), shuning uchun jadval o'chirilgan.
# Skaner foydalanuvchi kompyuterida run-scraper.cmd orqali ishlaydi.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skanerlash va yuborish
        run: node scraper.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      - name: Yuborilgan e'lonlar ro'yxatini saqlash
        if: always()
        run: |
          git config user.name "elontopbot"
          git config user.email "elontopbot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen list" && git push)
